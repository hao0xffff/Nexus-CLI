server:
  port: 8080

spring:
  application:
    name: ai-terminal
    
  # Redis 连接配置 (通过 spring-boot-starter-data-redis 自动装配)
  data:
    redis:
      host: 127.0.0.1
      port: 26379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  
# redis配置
app:
  redis:
    port: 26379
    max-heap: 128M
    chat:
      max-history-size: -1 # -1表示单会话无最大条数限制
      expire-hours: -1     # -1表示会话数据永不过期
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: "deepseek-r1:1.5b"

# Terminal Configuration
terminal:
  buffer-size: 50
  encoding:
    windows: GBK
    unix: UTF-8
  dangerous-commands:
    - "rm -rf /"
    - "rm -rf /*"
    - "mkfs"
    - "dd if=/dev/zero"
    - ":(){ :|:& };:"
    - "> /dev/sda"
    - "chmod -R 777 /"
    - "format c:"
    - "del /f /s /q c:\\*"

# Logging
logging:
  level:
    com.aiterminal: DEBUG
    org.springframework.web.socket: DEBUG
