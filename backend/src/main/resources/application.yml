server:
  port: 8080

spring:
  application:
    name: ai-terminal
  datasource:
    url: ${WORKLOG_DB_URL:jdbc:postgresql://localhost:5432/ai_terminal}
    username: ${WORKLOG_DB_USERNAME:postgres}
    password: ${WORKLOG_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  
  # AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: gpt-4o
          temperature: 0.7
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: "deepseek-r1:1.5b"

# Terminal Configuration
terminal:
  buffer-size: 50
  encoding:
    windows: GBK
    unix: UTF-8
  dangerous-commands:
    - "rm -rf /"
    - "rm -rf /*"
    - "mkfs"
    - "dd if=/dev/zero"
    - ":(){ :|:& };:"
    - "> /dev/sda"
    - "chmod -R 777 /"
    - "format c:"
    - "del /f /s /q c:\\*"

# Logging
logging:
  level:
    com.aiterminal: DEBUG
    org.springframework.web.socket: DEBUG
